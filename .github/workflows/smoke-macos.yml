name: Smoke (macOS)

# The main CI job skips Playwright's browser download and runs only the
# browser-free tests, so the compile path — headless Chromium plus the WASM TeX
# Live engine — has never executed in CI on any POSIX system, let alone macOS.
# Academic writing is the use case, so a large share of users are on macOS, and
# Windows↔POSIX path differences are exactly where a tool that resolves engine
# assets, project roots and git paths tends to break.
#
# This runs the real thing: launch the server, compile examples/minimal-paper,
# and check a genuine PDF comes back. Kept out of ci.yml because it needs a
# ~480 MB asset download and minutes rather than seconds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-on-macos:
    runs-on: macos-latest
    # A cold run downloads the engine assets; the cache makes later runs quick,
    # but never let a hung browser burn a full hour of macOS minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Keyed on the engine version: a texlyre-busytex bump must re-download
      # rather than silently reuse assets built for the previous release.
      - name: Restore TeX Live WASM assets
        id: assets
        uses: actions/cache@v6
        with:
          path: assets
          key: busytex-assets-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-macos-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build the workspace UI
        run: npm run build:ui

      # The assertion that matters: a real compile, then a real PDF fetched back
      # off the workspace server.
      - name: Compile a paper end to end
        run: node scripts/smoke-compile.mjs

      # Guards the regression where a broken edit replaced a good preview with a
      # truncated PDF and recorded it in the checkpoint history as a success.
      - name: A broken edit must not cost you the preview
        run: node scripts/smoke-error-handling.mjs

      # Both halves matter: a plain folder gets history without a .git appearing
      # in it, and a real repo keeps recording to its hidden ref. Adding the
      # first case rewrote every git call site, so the second needs guarding too.
      - name: History works with and without a project git repo
        run: node scripts/smoke-history.mjs

      # A highlight that drifts off its words is the review loop quietly lying
      # about what a comment refers to. This only shows up on a multi-line
      # highlight at particular zoom levels, so it needs a real browser.
      - name: Highlights stay on their words at every zoom
        run: node scripts/smoke-highlight-zoom.mjs

      # Matching used to be ASCII-only: an accented letter was a word break, so
      # French highlights lost their first/last letter, and a quote across a
      # hyphenated line break showed no highlight at all.
      - name: Highlights land on accented and hyphenated text
        run: node scripts/smoke-highlight-accents.mjs

      # The % label moving while the pages stay put reads as "zoom is broken".
      # It did, three ways: zoom re-downloaded the PDF (dead once the server
      # stopped), Ctrl+wheel zoomed the browser instead, and a page wider than
      # the pane could not be scrolled to its left edge.
      - name: Zoom resizes the pages — toolbar, Ctrl+wheel, after shutdown
        run: node scripts/smoke-zoom.mjs

      # With MAGICTEX_PORT pinned, a tab whose server crashed reconnects to the
      # next server on that port — possibly another project's — and its autosave
      # wrote into that project's file. Measured before the fix: it did.
      - name: A stale tab never writes into the next server on its port
        run: node scripts/smoke-stale-tab.mjs

      # A rendering failure nobody can reproduce is only as debuggable as the
      # message the reporter can screenshot. One that named no step, no page and
      # no stack produced three wrong root causes in a row.
      - name: A failed render says where it failed
        run: node scripts/smoke-render-error.mjs

      # A window left open after its server stops keeps showing that server's last
      # render — including its last error. A real bug was reported off one of those.
      - name: Shutting down closes the server and tells open windows
        run: node scripts/smoke-shutdown.mjs

      # /viewer is what render_preview opens when ui/dist is missing — a fresh
      # clone, or a publish that dropped it. Every other smoke uses /app, so this
      # fallback had no coverage at all, and shipped without the stale-window
      # warning the workspace had.
      - name: The legacy viewer also knows when its server has stopped
        run: node scripts/smoke-legacy-viewer.mjs

      # Three ways the editor silently discarded what someone had typed. All are
      # timing bugs that only exist between a click and a response, so they need
      # a real browser driving the real workspace.
      - name: The editor does not lose unsaved text
        run: node scripts/smoke-editor-keeps-text.mjs

      # The save chip used to clear on a two-second timer unconnected to the
      # compile, so on a real paper it went quiet ten seconds early — and did the
      # same when the compile failed. Only a real browser can catch a lie that
      # lives between the PUT returning and the compile ending.
      - name: The save chip tells the truth
        run: node scripts/smoke-save-chip-tells-truth.mjs

      - name: Save engine assets for next time
        if: steps.assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: assets
          key: busytex-assets-${{ hashFiles('package-lock.json') }}
